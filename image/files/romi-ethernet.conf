# romi-ethernet.conf: Ethernet takes a link-local 169.254 address while DHCP gives it none, as
# WPILibPi's dhcpcd did by IPv4LL. 4 is ipv4.link-local's "fallback", which NetworkManager.conf
# takes only by number. A profile that sets its own ipv4.link-local, as the Romi page's "DHCP
# with static fallback" does, keeps its own.
[connection-romi-eth0]
match-device=interface-name:eth0
ipv4.link-local=4
